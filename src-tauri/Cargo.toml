[package]
name = "zenoread"
version = "0.1.0"
description = "A local-first RSVP speed-reading application"
authors = ["Reyner Contreras"]
edition = "2024"

[workspace]
members = ["plugins/zenoread-android-fs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zenoread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-log = "2.9.1"
zenoread-android-fs = { path = "plugins/zenoread-android-fs" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

